<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- "Don't rerun": the rerun tile with its arrows replaced by a single
       padded diagonal, top left to bottom right. Drawn in-house. -->
  <rect width="64" height="64" rx="14" fill="#0066cc"/>
  <line x1="20" y1="20" x2="44" y2="44" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>
